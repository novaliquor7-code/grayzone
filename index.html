<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灰域獨立遊戲工作室</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111112;
      --surface: #1a1a1c;
      --border: #2e2e32;
      --text: #e8e8e6;
      --muted: #7a7a7e;
      --accent: #a8b5c8;
      --accent2: #c8b8a8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif TC', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景紋理 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(168,181,200,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 70%, rgba(200,184,168,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 粒子 */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 1px;
      height: 1px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { opacity: 0; transform: translateY(0) translateX(0); }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-120vh) translateX(var(--drift)); }
    }

    /* 主容器 */
    .card {
      position: relative;
      width: min(680px, 92vw);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 56px 52px;
      opacity: 0;
      transform: translateY(24px);
      animation: reveal 1s ease forwards 0.3s;
    }
    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 角落裝飾 */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.5;
    }
    .card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    /* 標籤行 */
    .tag-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      opacity: 0;
      animation: reveal 0.8s ease forwards 0.6s;
    }
    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      text-transform: uppercase;
    }
    .line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* 標題 */
    h1 {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 300;
      letter-spacing: 0.12em;
      line-height: 1.3;
      margin-bottom: 8px;
      opacity: 0;
      animation: reveal 0.8s ease forwards 0.8s;
    }
    h1 span {
      color: var(--accent);
    }

    /* 統編 */
    .reg {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.15em;
      margin-bottom: 32px;
      opacity: 0;
      animation: reveal 0.8s ease forwards 0.9s;
    }

    /* 分隔線 */
    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
      margin: 32px 0;
      opacity: 0;
      animation: reveal 0.8s ease forwards 1s;
    }

    /* 簡介 */
    .desc {
      font-size: 14px;
      line-height: 2;
      color: #b0b0ae;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0;
      animation: reveal 0.8s ease forwards 1.1s;
    }

    /* 聯絡區 */
    .contact {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      animation: reveal 0.8s ease forwards 1.3s;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: var(--text);
      transition: color 0.3s;
    }
    .contact-item:hover { color: var(--accent); }
    .contact-item:hover .contact-icon { border-color: var(--accent); color: var(--accent); }
    .contact-icon {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .contact-icon svg { width: 14px; height: 14px; fill: currentColor; }
    .contact-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      width: 48px;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .contact-value {
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    /* 底部 */
    .footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: reveal 0.8s ease forwards 1.5s;
    }
    .footer-text {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .dot {
      width: 6px; height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 28px; }
    }
  </style>
</head>
<body>

  <!-- 粒子 -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="tag-row">
      <span class="tag">Indie Game Studio</span>

    <h1>灰域<span>獨立遊戲</span>工作室</h1>
    <p class="reg">統一編號 · 60964995</p>

    <p class="desc">
      理性與感性、現實與幻想的模糊地帶，<br>
      模糊地帶中蘊含著所有遊戲的可能性，等待探索。
    </p>

    <div class="contact">

        <span class="contact-label">IG</span>

      </a>

      <a class="contact-item" href="mailto:grayzone0403@gmail.com">
        <div class="contact-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <span class="contact-label">Email</span>
        <span class="contact-value">grayzone0403@gmail.com</span>

    </div>

    <div class="footer">
      <span class="footer-text">© 2025 灰域獨立遊戲工作室</span>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // 粒子生成
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100 + 100}%;
        width: ${Math.random() < 0.3 ? 2 : 1}px;
        height: ${Math.random() < 0.3 ? 2 : 1}px;
        --drift: ${(Math.random() - 0.5) * 100}px;
        animation-duration: ${8 + Math.random() * 12}s;
        animation-delay: ${Math.random() * 10}s;
      `;
      container.appendChild(p);
    }
  </script>
</body>
</html>
